# Single-instance PostgreSQL for the Lightsail deployment. Never use the disposable
# root compose.yaml here; its fixed local-test password is not a deployment credential.
name: feedback
services:
  postgres:
    image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    restart: unless-stopped
    env_file: /etc/feedback/postgres.env
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on",
      "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_min_messages=fatal",
      "-c", "log_error_verbosity=terse", "-c", "log_connections=off", "-c", "log_disconnections=off",
      "-c", "log_min_duration_statement=-1", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback_migrator -d feedback"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
