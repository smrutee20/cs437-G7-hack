          <circle cx="23" cy="10" r="0.8"/><circle cx="26" cy="10" r="0.8"/><circle cx="29" cy="10" r="0.8"/><circle cx="32" cy="10" r="0.8"/><circle cx="35" cy="10" r="0.8"/><circle cx="23" cy="13" r="0.8"/><circle cx="26" cy="13" r="0.8"/><circle cx="29" cy="13" r="0.8"/><circle cx="32" cy="13" r="0.8"/><circle cx="35" cy="13" r="0.8"/><circle cx="23" cy="16" r="0.8"/><circle cx="26" cy="16" r="0.8"/><circle cx="29" cy="16" r="0.8"/><circle cx="32" cy="16" r="0.8"/><circle cx="35" cy="16" r="0.8"/><circle cx="23" cy="19" r="0.8"/><circle cx="26" cy="19" r="0.8"/><circle cx="29" cy="19" r="0.8"/><circle cx="32" cy="19" r="0.8"/><circle cx="35" cy="19" r="0.8"/><circle cx="23" cy="22" r="0.8"/><circle cx="26" cy="22" r="0.8"/><circle cx="29" cy="22" r="0.8"/><circle cx="32" cy="22" r="0.8"/><circle cx="35" cy="22" r="0.8"/><circle cx="23" cy="25" r="0.8"/><circle cx="26" cy="25" r="0.8"/><circle cx="29" cy="25" r="0.8"/><circle cx="32" cy="25" r="0.8"/><circle cx="35" cy="25" r="0.8"/><circle cx="23" cy="28" r="0.8"/><circle cx="26" cy="28" r="0.8"/><circle cx="29" cy="28" r="0.8"/><circle cx="32" cy="28" r="0.8"/><circle cx="35" cy="28" r="0.8"/>
