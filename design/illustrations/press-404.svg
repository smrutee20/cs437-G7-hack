<svg xmlns="http://www.w3.org/2000/svg" width="474" height="495" viewBox="16 40 316 330" role="img" aria-labelledby="t">
  <title id="t">A stamp press stamps 404 onto a blank card, which slides out and lights up. Loops every 5 seconds.</title>
  <style>
    *{vector-effect:non-scaling-stroke}
    .led{fill:#343434}
    .dim404,.lit404{opacity:0}
    .lit404{filter:drop-shadow(0 0 2px rgba(255,255,255,.85))}
    .head{animation:stamp 5s ease infinite}
    .lever{animation:lever 5s ease infinite}
    .slide{animation:slide 5s ease infinite}
    .dim404{animation:dim 5s linear infinite}
    .lit404{animation:lit 5s ease infinite}
    .led{animation:led 5s linear infinite}
    @keyframes stamp{0%,10%{transform:translateY(0)}20%,24%{transform:translateY(22px)}32%,100%{transform:translateY(0)}}
    @keyframes lever{0%,4%{transform:rotate(0deg)}14%,24%{transform:rotate(65deg)}36%,100%{transform:rotate(0deg)}}
    @keyframes slide{0%,30%{transform:translate(0,0);opacity:1}44%,86%{transform:translate(52px,30px);opacity:1}93%{transform:translate(52px,30px);opacity:0}94%{transform:translate(0,0);opacity:0}100%{transform:translate(0,0);opacity:1}}
    @keyframes dim{0%,20%{opacity:0}22%,92%{opacity:1}94%,100%{opacity:0}}
    @keyframes lit{0%,46%{opacity:0}52%,86%{opacity:1}92%,100%{opacity:0}}
    @keyframes led{0%,46%{fill:#343434}52%,86%{fill:#f5f5f5}92%,100%{fill:#343434}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.slide{transform:translate(52px,30px)}.dim404,.lit404{opacity:1}.led{fill:#f5f5f5}}
  </style>
