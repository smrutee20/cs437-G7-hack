      <circle class="led" cx="22" cy="48" r="1.8"/><circle class="led" cx="38" cy="48" r="1.8"/>
      <circle class="led" cx="22" cy="60" r="1.8"/><circle class="led" cx="38" cy="60" r="1.8"/>
