    <polygon points="20.1,261.0 193.3,361.0 193.3,347.0 20.1,247.0" fill="#151515"/>
    <polygon points="323.2,286.0 193.3,361.0 193.3,347.0 323.2,272.0" fill="#111111"/>
    <!-- column with LED strip -->
