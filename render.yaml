# Render blueprint: one free web service and one free Postgres database.
services:
  - type: web
    name: anything-g7
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: anything-g7-db
          property: connectionString

databases:
  - name: anything-g7-db
    plan: free
    region: singapore
